experiment_name: baseline_thermal
seed: 42
n_seeds: 5
data:
  adapters:
  - irsm
  - cali
  - solarfcd
  - rgbirpv
  - bimodal_uav
  - nrel_pvdaq
  index_path: data/processed/index/full.parquet
  processed_images_dir: data/processed/images
  processed_electrical_dir: data/processed/electrical
preprocessing:
  rgb:
    image_size: 224
    normalize_mean:
    - 0.485
    - 0.456
    - 0.406
    normalize_std:
    - 0.229
    - 0.224
    - 0.225
    blur_filter_laplacian_threshold: 100.0
  thermal:
    image_size: 224
    use_raw_radiometric: false
  electrical:
    iv_resample_points: 100
    stc_irradiance: 1000.0
    stc_temperature: 25.0
  quality_control:
    irradiance_min_w_m2: 600.0
    wind_max_m_s: 5.0
  synchronization:
    max_time_delta_seconds: 120
model:
  modalities:
  - thermal
  image_backbone: efficientnet_b0
  fusion_type: late
  dg_method: none
  modality_dropout_prob: 0.15
  rgb_feature_dim: 256
  thermal_feature_dim: 256
  elec_feature_dim: 128
  shared_dim: 256
  num_fault_classes: 7
  bottleneck_dropout: 0.2
  transformer_dropout: 0.1
  cross_attn_heads: 2
  cross_attn_hidden: 256
  elec_cnn_channels:
  - 2
  - 32
  - 64
  - 128
  elec_transformer_d_model: 128
  elec_transformer_nhead: 4
  elec_transformer_layers: 2
  elec_num_scalars: 7
  elec_num_env: 3
training:
  loss_type: focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  coral_weight: 1.0
  adversarial_weight: 1.0
  mmd_weight: 1.0
  grl_lambda_schedule: dann_linear_warmup
  optimizer: adamw
  lr: 0.0001
  weight_decay: 1.0e-05
  warmup_steps: 500
  batch_size: 64
  epochs: 1
  deterministic: true
  early_stopping_patience: 1
  n_seeds: 5
synthetic:
  ratio: 0.0
  ssim_min_threshold: 0.75
  electrical_dir: data/synthetic/electrical
  images_dir: data/synthetic/images
evaluation:
  protocol: random_split
  primary_metric: macro_f1
  lodo_index_dir: data/processed/index
  bootstrap_n_resamples: 1000
  confidence_level: 0.95
optuna:
  enabled: false
  n_trials: 30
  objective: mean_lodo_macro_f1
logging:
  tracker: mlflow
  log_dir: logs/
  mlflow_tracking_uri: logs/mlruns
output:
  results_dir: results
  checkpoints_dir: checkpoints
  experiments_registry: experiments/registry.json
hardware:
  device: cpu
  mixed_precision: false
