[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-fault-detection"
version = "0.1.0"
description = "Multimodal Deep Learning and Physics-Informed Synthetic Augmentation for Cross-Site Generalizable Photovoltaic Fault Detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.1",
    "diffusers>=0.24.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "scikit-learn>=1.3.0",
    "pvlib>=0.10.2",
    "scipy>=1.11.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.1",
    "mlflow>=2.9.0",
    "optuna>=3.5.0",
    "umap-learn>=0.5.5",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "Pillow>=10.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (fast, no external data required)",
    "integration: integration tests (may require processed data)",
    "leakage: data leakage tests (load-bearing; if these fail, pipeline is wrong)",
    "slow: tests that take >10s (use -m 'not slow' for quick runs)",
]
