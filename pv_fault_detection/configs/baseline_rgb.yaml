# configs/baseline_rgb.yaml
# Ablation matrix row 1: RGB-only baseline (in-domain, random split)
# Research ladder Level 1/2 floor for RQ1/RQ2.

experiment_name: "baseline_rgb"

model:
  modalities: [rgb]
  fusion_type: "late"   # no fusion needed for single modality
  dg_method: "none"

evaluation:
  protocol: "random_split"

synthetic:
  ratio: 0.0
