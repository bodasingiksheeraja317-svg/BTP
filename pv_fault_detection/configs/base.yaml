# configs/base.yaml
# Base configuration — all experiment configs inherit from this.
# EVERY key that any experiment might need is defined here with defaults.
# Experiment configs only override what differs.
# Sections correspond to spec Section 18.

experiment_name: "unnamed"
seed: 42
n_seeds: 5  # ASSUMPTION: 5 seeds per config per spec Section 14.3; may drop to 3 under compute constraints

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  adapters: [irsm, cali, solarfcd, rgbirpv, bimodal_uav, nrel_pvdaq]
  # elpv excluded from default registry per spec Section 6.2 (optional sub-study)
  index_path: "data/processed/index/full.parquet"
  processed_images_dir: "data/processed/images"
  processed_electrical_dir: "data/processed/electrical"

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  rgb:
    image_size: 224
    normalize_mean: [0.485, 0.456, 0.406]  # ImageNet means
    normalize_std: [0.229, 0.224, 0.225]   # ImageNet stds
    blur_filter_laplacian_threshold: 100.0  # reject images with Laplacian variance < this
  thermal:
    image_size: 224
    use_raw_radiometric: false  # set true when thermal_raw_path is available
  electrical:
    iv_resample_points: 100
    stc_irradiance: 1000.0   # W/m^2, Standard Test Conditions
    stc_temperature: 25.0    # Celsius
  quality_control:
    irradiance_min_w_m2: 600.0  # ASSUMPTION: IEC 62446-3-style threshold; config-overridable
    wind_max_m_s: 5.0           # ASSUMPTION: IEC 62446-3-style threshold; config-overridable
  synchronization:
    max_time_delta_seconds: 120  # +/-2 min UTC timestamp tolerance for image<->electrical pairing

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  modalities: [rgb, thermal, electrical]  # subset list for ablation rows
  image_backbone: "efficientnet_b0"        # or "convnext_tiny"
  fusion_type: "cross_attention"           # "cross_attention" | "late"
  dg_method: "none"                        # "none" | "coral" | "adversarial" | "domain_norm"
  modality_dropout_prob: 0.15              # ASSUMPTION: default per spec Section 5
  # Encoder dims (fixed per spec Section 10 — do not change without updating pv_fault_model.py)
  rgb_feature_dim: 256
  thermal_feature_dim: 256
  elec_feature_dim: 128
  shared_dim: 256                          # shared bottleneck z
  num_fault_classes: 7                     # fixed per spec Section 7.1
  # Dropout
  bottleneck_dropout: 0.2
  transformer_dropout: 0.1
  # Cross-attention parameters
  cross_attn_heads: 2
  cross_attn_hidden: 256
  # Electrical encoder
  elec_cnn_channels: [2, 32, 64, 128]
  elec_transformer_d_model: 128
  elec_transformer_nhead: 4
  elec_transformer_layers: 2
  elec_num_scalars: 7   # Voc, Isc, Vmp, Imp, FF, Rs, Rsh
  elec_num_env: 3        # irradiance, ambient_temp, wind

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  loss_type: "focal"              # "focal" | "class_weighted_bce"
  focal_alpha: 0.25               # ASSUMPTION: standard focal loss default
  focal_gamma: 2.0                # ASSUMPTION: standard focal loss default
  coral_weight: 1.0               # ASSUMPTION: per spec Section 12; tune via Optuna
  adversarial_weight: 1.0         # ASSUMPTION: per spec Section 12
  mmd_weight: 1.0
  grl_lambda_schedule: "dann_linear_warmup"  # linear warm-up over first 30% of training
  optimizer: "adamw"              # ASSUMPTION: per spec Section 13.3
  lr: 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 500
  batch_size: 32
  epochs: 50
  deterministic: true             # torch.backends.cudnn.deterministic; slower but reproducible
  early_stopping_patience: 10
  n_seeds: 5                      # duplicated here for trainer access

# ---------------------------------------------------------------------------
# Synthetic data
# ---------------------------------------------------------------------------
synthetic:
  ratio: 0.0  # 0.0 | 0.1 | 0.25 | 0.5 | 1.0 | "unlimited" | "pretrain_finetune" | "domain_randomized"
  ssim_min_threshold: 0.75   # ASSUMPTION: per spec Section 11.2
  electrical_dir: "data/synthetic/electrical"
  images_dir: "data/synthetic/images"

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  protocol: "random_split"    # "random_split" | "lodo"
  primary_metric: "macro_f1"
  # LODO-specific
  lodo_index_dir: "data/processed/index"
  # Statistical tests
  bootstrap_n_resamples: 1000
  confidence_level: 0.95

# ---------------------------------------------------------------------------
# Hyperparameter search (Optuna)
# ---------------------------------------------------------------------------
optuna:
  enabled: false
  n_trials: 30     # ASSUMPTION: per spec Section 13.4; only for Level-6 final config + DG HPs
  objective: "mean_lodo_macro_f1"

# ---------------------------------------------------------------------------
# Logging / experiment tracking
# ---------------------------------------------------------------------------
logging:
  tracker: "mlflow"        # ASSUMPTION: "mlflow" | "wandb" | "tensorboard" per spec Section 24
  log_dir: "logs/"
  mlflow_tracking_uri: "logs/mlruns"

# ---------------------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------------------
output:
  results_dir: "results"
  checkpoints_dir: "checkpoints"
  experiments_registry: "experiments/registry.json"

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
hardware:
  device: "cuda"          # falls back to cpu automatically if unavailable
  mixed_precision: true
